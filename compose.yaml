name: ai-assistant

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      AI_DB_USER: ${AI_DB_USER:?AI_DB_USER is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}

      ORDER_DB_USER: ${ORDER_DB_USER:?ORDER_DB_USER is required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e

    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile

    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"

      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

      AI_DB_USER: ${AI_DB_USER:?AI_DB_USER is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}

      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8080/actuator/health
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile

    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"

      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

      ORDER_DB_USER: ${ORDER_DB_USER:?ORDER_DB_USER is required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}

      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8080/actuator/health
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
